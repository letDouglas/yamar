apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: default

  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: alloy
      targetRevision: 1.6.0
      helm:
        releaseName: alloy
        valueFiles:
          - $yamar-repo/infra/resources/values/alloy-values.yaml

    - repoURL: 'https://github.com/letDouglas/yamar.git'
      targetRevision: main
      ref: yamar-repo

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
